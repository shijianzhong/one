[package]
name = "one"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { path = "vendor/zed/crates/gpui", default-features = false, features = ["font-kit"] }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit"] }
gpui_macros = { path = "vendor/zed/crates/gpui_macros" }
gpui_util = { path = "vendor/zed/crates/gpui_util" }
gpui_shared_string = { path = "vendor/zed/crates/gpui_shared_string" }
gpui_tokio = { path = "vendor/zed/crates/gpui_tokio" }
reqwest_client = { path = "vendor/zed/crates/reqwest_client" }
http = "1"
editor = { path = "vendor/zed/crates/editor" }
settings = { path = "vendor/zed/crates/settings" }
theme = { path = "vendor/zed/crates/theme" }
theme_settings = { path = "vendor/zed/crates/theme_settings" }
menu = { path = "vendor/zed/crates/menu" }
one_components = { path = "./components" }
sqlez = { path = "vendor/zed/crates/sqlez" }
alacritty_terminal = "0.26"
portable-pty = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
acpx = { path = "./acpx" }
system_tools = { path = "./skills/system_tools" }
bollard = { version = "0.18", optional = true }
async-trait = "0.1"
image = "0.25"
which = "6"
rust-embed = "8"
chrono = "0.4"
bcrypt = "0.19.1"

[features]
default = []
sandbox = ["bollard"]
workflow-webview = ["dep:wry"]

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.53", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { path = "vendor/zed/crates/gpui_linux" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
