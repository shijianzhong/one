[package]
name = "one"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["acpx", "."]

[dependencies]
gpui = { path = "/Users/shijianzhong/sking/zed/crates/gpui", default-features = false, features = ["font-kit"] }
gpui_platform = { path = "/Users/shijianzhong/sking/zed/crates/gpui_platform", features = ["font-kit"] }
gpui_macros = { path = "/Users/shijianzhong/sking/zed/crates/gpui_macros" }
gpui_util = { path = "/Users/shijianzhong/sking/zed/crates/gpui_util" }
gpui_shared_string = { path = "/Users/shijianzhong/sking/zed/crates/gpui_shared_string" }
gpui_tokio = { path = "/Users/shijianzhong/sking/zed/crates/gpui_tokio" }
reqwest_client = { path = "/Users/shijianzhong/sking/zed/crates/reqwest_client" }
http = "1"
editor = { path = "/Users/shijianzhong/sking/zed/crates/editor" }
settings = { path = "/Users/shijianzhong/sking/zed/crates/settings" }
theme = { path = "/Users/shijianzhong/sking/zed/crates/theme" }
theme_settings = { path = "/Users/shijianzhong/sking/zed/crates/theme_settings" }
menu = { path = "/Users/shijianzhong/sking/zed/crates/menu" }
one_components = { path = "./components" }
sqlez = { path = "/Users/shijianzhong/sking/zed/crates/sqlez" }
alacritty_terminal = "0.26"
portable-pty = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
acpx = { path = "./acpx" }
bollard = { version = "0.18", optional = true }
async-trait = "0.1"
image = "0.25"
which = "6"
rust-embed = "8"

[features]
default = []
sandbox = ["bollard"]

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { path = "/Users/shijianzhong/sking/zed/crates/gpui_linux" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
