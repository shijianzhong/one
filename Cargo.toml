[package]
name = "solo3_gpui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { path = "/Users/shijianzhong/sking/zed/crates/gpui", default-features = false, features = ["font-kit"] }
gpui_platform = { path = "/Users/shijianzhong/sking/zed/crates/gpui_platform", features = ["font-kit"] }
gpui_macros = { path = "/Users/shijianzhong/sking/zed/crates/gpui_macros" }
gpui_util = { path = "/Users/shijianzhong/sking/zed/crates/gpui_util" }
